<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanya | Developer Portfolio</title>
    <link rel="icon" type="image/png" href="./assets/bears_hand.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="nav-brand">
            <img src="./assets/logo.png" alt="Sanya Logo" onerror="this.style.display='none'">
            Sanya
        </a>
        
        <div class="nav-center">
            <a href="index.html" class="active" data-i18n="nav.home">Home</a>
            <a href="tools.html" data-i18n="nav.projects">Projects</a>
            <a href="https://github.com/bishpop" target="_blank">GitHub ↗</a>
        </div>

        <div class="controls-wrapper">
            <button id="themeToggle" class="theme-toggle" title="Toggle Theme">☀️</button>
            <div class="lang-switcher">
                <button class="lang-btn active" data-lang="en">EN</button>
                <span class="lang-divider">|</span>
                <button class="lang-btn" data-lang="zh">简</button>
            </div>
        </div>
    </nav>

    <div class="page-wrapper fade-in">
        <div class="container hero-section">
            <div class="hero-content">
                <span class="accent-text" data-i18n="index.accent">Software & Tools</span>
                <h1 data-i18n="index.h1">Building custom solutions & logic converters.</h1>
                <p data-i18n="index.desc">Welcome to my portfolio. I specialize in C#, UI/UX customization, and developing specialized tools like the SanConverter for rhythm game charting logic.</p>
                
                <div class="hero-actions" style="align-items: center; gap: 20px; display: flex;">
                    <a href="sanconverter.html" class="btn-glow" style="padding: 15px 35px; font-size: 1.05rem;" data-i18n="index.btn.sanconverter">
                        SanConverter
                    </a>
                    <a href="tools.html" class="btn btn-secondary" style="border-radius: 50px; padding: 14px 30px;" data-i18n="index.btn.projects">
                        Explore Projects
                    </a>
                </div>
            </div>
            
            <div class="hero-visual">
                <img src="./assets/logo.png" alt="Sanya Profile" onerror="this.style.display='none'">
            </div>
        </div>
    </div>

    <script src="i18n.js"></script>
</body>
</html>
